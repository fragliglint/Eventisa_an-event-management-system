<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Upload</title>
    <link rel="stylesheet" href="event_upload.css" />
  </head>
  <body>
    <div id="overlay" class="overlay"></div>

    <nav id="mySidenav" class="sidenav">
      <div class="sidebar-user">
        <div class="avatar">M</div>
        <span class="username">Md. Abdul Karim</span>
      </div>
      <a href="dashboard.html">Dashboard</a>
      <a href="event_upload.html">Upload Event</a>
      <a href="#">Notifications</a>
      <a href="#">Logout</a>
    </nav>

    <header class="topbar">
      <button id="menuBtn" class="menu-btn">☰</button>
      <h1 class="topbar-title">Event Upload</h1>
      <div class="topbar-actions">
        <div class="user-profile">
          <div class="avatar">M</div>
          <span class="username">Md. Abdul Karim</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="form-wrap">
        <section class="form-container">
          <form id="eventForm" novalidate>
            <div class="form-content">
              <div class="form-left">
                <div class="form-group">
                  <label for="title">Event Title</label>
                  <input type="text" id="title" name="title" required />
                </div>
                <div class="form-group">
                  <label for="location">Location</label>
                  <input type="text" id="location" name="location" required />
                </div>
                <div class="form-row-group">
  <div class="form-group date-picker">
    <label for="date">Date</label>
    <div class="input-with-icon">
      <input type="date" id="date" name="date" required />
      <span class="icon">&#128197;</span> <!-- Calendar icon -->
    </div>
  </div>
  <div class="form-group time-picker">
    <label for="time">Time</label>
    <div class="input-with-icon">
      <input type="time" id="time" name="time" required />
      <span class="icon">&#128337;</span> <!-- Clock icon -->
    </div>
  </div>
</div>
                <div class="form-group">
                  <label for="description">Description</label>
                  <textarea
                    id="description"
                    name="description"
                    placeholder="Enter event description"
                    required
                  ></textarea>
                </div>
                <div class="form-group">
                  <label for="price">Price (Tk)</label>
                  <input type="number" id="price" name="price" min="0" />
                </div>
              </div>

              <div class="form-right">
                <div class="form-group">
                  <label for="banner">Event Banner</label>
                  <div class="banner-box" id="bannerBox">
                    <input
                      type="file"
                      id="banner"
                      name="banner"
                      accept="image/*"
                    />
                    <img id="bannerPreview" alt="Event Banner Preview" />
                    <div class="banner-placeholder" id="bannerPlaceholder">
                      <div class="upload-icon">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path
                            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                          ></path>
                          <polyline points="17 8 12 3 7 8"></polyline>
                          <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                      </div>
                      <p>Drag and drop a file here</p>
                      <p>or</p>
                      <button type="button" class="btn browse-btn">
                        Browse...
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn upload">Upload</button>
              <button type="button" class="btn cancel" id="cancelBtn">
                Cancel
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <script src="event_upload.js"></script>
  </body>
</html>
